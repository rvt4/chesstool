<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessTool V2</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
<header>
  <div class="logo">♟ ChessTool <small>English · Caro-Kann · Plans · V2</small></div>
  <nav>
    <button class="nb on"  onclick="setMode('drill')">Drill</button>
    <button class="nb"     onclick="setMode('explorer')">Explorer</button>
    <button class="nb"     onclick="setMode('quiz')">Quiz</button>
    <button class="nb"     onclick="setMode('plans')">Plans</button>
    <button class="nb"     onclick="setMode('bot')">vs Bot</button>
  </nav>
</header>
<div class="app">
  <div class="bcol">
    <div class="bwrap">
      <div class="bouter">
        <div class="rcol" id="rlabels"></div>
        <div>
          <div id="board"></div>
          <div class="frow" id="flabels"></div>
        </div>
      </div>
    </div>
    <div class="bctrl">
      <button class="cb" onclick="goBack()">← Back</button>
      <button class="cb" onclick="doReset()">↺ Reset</button>
      <button class="cb" id="hintbtn" onclick="doHint()">💡 Hint</button>
      <button class="cb" onclick="doFlip()">⇅ Flip</button>
      <button class="cb p hidden" id="colorbtn" onclick="toggleSide()">White</button>
      <button class="cb p hidden" id="randbtn"  onclick="startRandom()">▶ Random Line</button>
      <button class="cb p hidden" id="newgamebtn" onclick="startBotGame()">▶ New Game</button>
      <button class="cb   hidden" id="revbtn"   onclick="showReview()">🔍 Review</button>
    </div>
  </div>
  <div class="panel">
    <div class="card">
      <div class="ch">Opening</div>
      <div class="cb2">
        <div id="opname">Starting Position</div>
        <div id="opeco"></div>
        <div class="pw"><div class="pb" id="prog" style="width:0%"></div></div>
        <div id="note">Select a mode above to begin.</div>
      </div>
    </div>
    <div class="card"><div class="ch">Status</div><div class="cb2"><div id="stat" class="info">Welcome!</div></div></div>
    <div class="card"><div class="ch">Moves</div><div class="cb2"><div id="mvlist"></div></div></div>
    <!-- drill line picker -->
    <div class="card" id="linecard">
      <div class="ch">Lines to Drill</div>
      <div class="cb2"><div id="linesel"></div></div>
    </div>
    <!-- explorer tree -->
    <div class="card hidden" id="expcard">
      <div class="ch">Continuations</div>
      <div class="cb2"><div id="tree"></div></div>
    </div>
    <!-- quiz -->
    <div class="card hidden" id="quizcard">
      <div class="ch"><span>Quiz</span><span id="qsc" style="color:var(--acc);font-size:.8rem">0 / 0</span></div>
      <div class="cb2">
        <div id="qq" style="margin-bottom:10px;font-size:.84rem"></div>
        <div id="qopts"></div>
      </div>
    </div>
    <!-- bot settings -->
    <!-- plans -->
    <div class="card hidden" id="plancard">
      <div class="ch"><span>Middlegame Plans</span><span id="psc" style="color:var(--acc);font-size:.8rem">0 / 0</span></div>
      <div class="cb2">
        <div id="planq" class="planq"></div>
        <div id="planopts"></div>
        <button class="cb p" id="nextplan" onclick="startPlanQuiz()" style="width:100%;margin-top:7px">Next Position</button>
      </div>
    </div>
    <div class="card hidden" id="planinfocard">
      <div class="ch">Position Blueprint</div>
      <div class="cb2" id="planinfo"></div>
    </div>
    <div class="card hidden" id="botcard">
      <div class="ch">Bot Settings</div>
      <div class="cb2" style="display:flex;flex-direction:column;gap:9px">
        <div style="font-size:.77rem;color:var(--muted)">Skill</div>
        <div class="skrow">
          <button class="skb on" id="sk0" onclick="setBotSkill(1,'Beginner')">Beginner</button>
          <button class="skb"    id="sk1" onclick="setBotSkill(8,'Club')">Club</button>
          <button class="skb"    id="sk2" onclick="setBotSkill(16,'Strong')">Strong</button>
        </div>
        <div style="font-size:.77rem;color:var(--muted);margin-top:3px">Play as</div>
        <div class="skrow">
          <button class="skb on" id="bc0" onclick="setBotColor('white')">White</button>
          <button class="skb"    id="bc1" onclick="setBotColor('black')">Black</button>
        </div>
      </div>
    </div>
    <!-- review -->
    <div class="card hidden" id="revcard">
      <div class="ch">Game Review</div>
      <div class="cb2"><div id="revlist"></div></div>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="data/repertoire.js"></script>
<script src="data/plans.js"></script>
<script src="js/app.js"></script>
</body>
</html>
